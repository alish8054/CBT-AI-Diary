server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-crimson-feather-apylr8en-pooler.c-7.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}

spring.ai.openai.api-key=${OPENAI_API_KEY:local-development-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5.2}

app.auth.jwt-secret=${JWT_SECRET}
