spring.datasource.url=jdbc:postgresql://localhost:5432/diploma
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${OPENAI_API_KEY:local-development-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5.2}
app.ai.socratic-question-count=${AI_SOCRATIC_QUESTION_COUNT:5}

app.auth.jwt-secret=${JWT_SECRET:local-dev-change-this-secret}
