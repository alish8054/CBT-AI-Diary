spring.datasource.url=jdbc:h2:mem:diploma_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5.2}
